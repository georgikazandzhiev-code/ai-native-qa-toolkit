name: Validate

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  toolkit:
    name: Toolkit structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Zero dependencies by design, so this runs before any install.
      - name: Validate toolkit structure
        run: npm run validate

  plugin:
    name: Lint plugin rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eslint-plugin-qa-constitution
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install plugin dev dependencies
        run: npm install --no-audit --no-fund

      # 21 RuleTester suites, including a regression suite for every false positive the
      # lint-gate eval and the fault-injection harness have exposed.
      - name: Run rule tests
        run: node tests/rules.test.js

      # The claim "these rules bite" used to be prose. This is the assertion behind it:
      # every rule must fire on the known-bad tree, stay silent on the compliant tree,
      # and stop reporting when its visitor is emptied. A rule with no fixture case fails
      # here rather than being skipped, so a new rule cannot land without something to
      # catch and something to leave alone.
      - name: Fault injection — every rule bites, and nothing cries wolf
        run: node tests/fault-injection.test.mjs

      # The plugin must not violate the constitution it enforces: a deliberately
      # non-compliant fixture has to be reported, not pass.
      - name: Smoke test — the bad tree must fail the gate
        run: |
          if npx eslint --config smoke/eslint.config.mjs "smoke/tests/**/*.ts"; then
            echo "::error::The known-bad fixture passed the gate — a rule has stopped firing."
            exit 1
          else
            echo "Known-bad fixture correctly rejected."
          fi

      # The other half, and the one that decides whether anyone keeps the gate switched on:
      # compliant code must lint clean with all sixteen rules enabled at once.
      - name: Smoke test — the compliant tree must pass the gate
        run: npx eslint --config smoke/eslint.config.mjs "smoke/good/**/*.ts" --max-warnings 0

  regression:
    name: Skill eval regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check:bump needs history to diff against the base ref

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fails only on a score drop that clears the noise floor. A delta inside the floor
      # is reported as noise, deliberately: at two cases per skill, +-1 is variance, and a
      # tool that calls variance progress teaches you to trust it.
      - name: Compare eval history
        run: npm run eval:compare

      # Advisory. Warns when a SKILL.md changed and its version did not, because that is
      # the moment the eval history stops describing the file it claims to score.
      - name: Version bump reminder
        run: npm run check:bump origin/${{ github.base_ref || 'main' }}
        continue-on-error: true
